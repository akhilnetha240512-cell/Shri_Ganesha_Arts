<head>

<title>Sher Ganesh Arts — Raikal | Handmade Bal Ganesh Idols, Jagtial</title>
<meta name="description" content="Sher Ganesh Arts, Raikal Village, Jagtial District — handmade Bal Ganesh Bappa idols. Selfie Bappa, Peshwa Bappa, Pink Pagdi Bappa, Eco-Friendly Matti Ganesh. Sizes 1ft to 12ft. DM for customized idols.">

<style>
  :root{
    --saffron:#FF6F00;
    --saffron-deep:#E25A00;
    --gold:#E8A831;
    --gold-bright:#FFD700;
    --maroon:#7A1F2B;
    --maroon-deep:#5A1420;
    --ivory:#FFF8EC;
    --ivory-dim:#FBEFDA;
    --blush:#FF8FAB;
    --blush-deep:#E85D82;
    --charcoal:#241209;
    --charcoal-2:#331A0D;
    --ink:#3A2417;
    --ok:#2E7D4F;
    --booked:#B5482C;
    --shadow: 0 18px 40px -14px rgba(122,31,43,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--ivory);
    color:var(--ink);
    overflow-x:hidden;
  }
  img{max-width:100%; display:block;}
  h1,h2,h3,.display{font-family:'Yatra One', cursive; font-weight:400; letter-spacing:.5px;}
  .eyebrow{
    font-family:'Rajdhani',sans-serif;
    font-weight:700; letter-spacing:.22em; text-transform:uppercase;
    font-size:12.5px; color:var(--saffron-deep);
  }
  a{color:inherit; text-decoration:none;}
  .container{max-width:1200px; margin:0 auto; padding:0 20px;}
  ::selection{background:var(--gold-bright); color:var(--maroon-deep);}

  /* ---------- Toran / marigold garland divider (signature element) ---------- */
  .toran{
    width:100%; height:34px; line-height:0;
    background-repeat:repeat-x; background-size:46px 34px;
    background-image: radial-gradient(circle at 12px 6px, var(--saffron) 0 6px, transparent 7px),
                       radial-gradient(circle at 12px 6px, var(--gold-bright) 0 3px, transparent 4px),
                       radial-gradient(circle at 34px 14px, #3E7D33 0 5px, transparent 6px);
    position:relative;
  }
  .toran::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--maroon) 0 20px, transparent 20px 24px);
    opacity:.35;
  }

  /* ---------- Top utility bar ---------- */
  .topbar{
    background:var(--charcoal); color:#f4e6c8; font-family:'Rajdhani',sans-serif;
    font-size:13.5px; font-weight:600; letter-spacing:.03em;
  }
  .topbar .container{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 20px; flex-wrap:wrap; gap:6px;
  }
  .topbar span.icon{margin-right:5px;}
  .topbar-links{display:flex; gap:18px; flex-wrap:wrap;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:60;
    background:linear-gradient(180deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    box-shadow:0 4px 18px rgba(0,0,0,.25);
  }
  .nav-wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px; color:var(--ivory);}
  .brand .om{
    width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--saffron) 70%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Yatra One',cursive; font-size:24px; color:var(--maroon-deep);
    box-shadow:0 0 0 3px rgba(255,215,0,.35);
    flex-shrink:0;
  }
  .brand-text h1{font-size:20px; color:#fff; line-height:1.1;}
  .brand-text p{font-family:'Rajdhani',sans-serif; font-size:11.5px; letter-spacing:.18em; color:var(--gold-bright); text-transform:uppercase; margin-top:2px;}

  nav.main-menu{display:flex; gap:26px; font-weight:600; font-size:15px;}
  nav.main-menu a{color:#f6e9d0; position:relative; padding:4px 0;}
  nav.main-menu a:hover{color:var(--gold-bright);}
  nav.main-menu a::after{
    content:""; position:absolute; left:0; bottom:-3px; width:0; height:2px; background:var(--gold-bright);
    transition:width .25s ease;
  }
  nav.main-menu a:hover::after{width:100%;}

  .header-actions{display:flex; align-items:center; gap:10px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:30px; font-weight:600; font-size:14.5px;
    cursor:pointer; border:none; transition:transform .18s ease, box-shadow .18s ease;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-call{background:var(--saffron); color:#fff; box-shadow:0 8px 18px -6px rgba(255,111,0,.6);}
  .btn-whatsapp{background:#25D366; color:#fff; box-shadow:0 8px 18px -6px rgba(37,211,102,.55);}
  .btn-insta{
    background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF,#515BD4);
    color:#fff; box-shadow:0 8px 18px -6px rgba(220,42,123,.5);
  }
  .btn-gold{background:linear-gradient(135deg, var(--gold-bright), var(--gold)); color:var(--maroon-deep); box-shadow:0 8px 20px -6px rgba(232,168,49,.6);}
  .btn-outline{background:transparent; border:2px solid var(--ivory); color:var(--ivory);}
  .btn-outline:hover{background:var(--ivory); color:var(--maroon-deep);}
  .btn-block{width:100%; justify-content:center;}
  .hamburger{display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px;}
  .hamburger span{width:26px; height:2.5px; background:#fff; border-radius:2px;}

  /* ---------- Hero ---------- */

    position:relative; min-height:88vh; display:flex; align-items:flex-end;
    background:linear-gradient(180deg, rgba(36,18,9,.15) 0%, rgba(36,18,9,.55) 55%, rgba(36,18,9,.92) 100%),
